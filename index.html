<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to June 10, 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(240, 244, 248, 0.5) 50%, rgba(224, 231, 255, 0.5) 100%), url('imgs/bg.png') no-repeat center center/cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 10px;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            margin-top: 0px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 50px;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }

        .subtitle {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 50px;
            font-weight: 300;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            padding: 30px 40px;
            min-width: 140px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
            flex: 1;
            max-width: 180px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .time-box:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 35px rgba(37, 99, 235, 0.15);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .number {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            color: #2563eb;
            display: block;
            line-height: 1;
            text-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
            margin-top: 10px;
            display: block;
            font-weight: 600;
        }

        .target-date {
            margin-top: 50px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .target-date p {
            color: #64748b;
            font-size: 1rem;
        }

        .target-date .date-highlight {
            color: #2563eb;
            font-weight: 600;
            font-size: 1.2rem;
        }

        .progress-bar {
            width: 100%;
            max-width: 600px;
            height: 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            margin: 40px auto 0;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            border-radius: 4px;
            transition: width 1s ease;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.2);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(37, 99, 235, 0.15);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        .expired {
            display: none;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Tablets */
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; margin-bottom: 30px; }
            .number { font-size: 2.5rem; }
            .time-box { 
                padding: 20px 25px; 
                min-width: 100px; 
                max-width: 140px;
                gap: 15px;
            }
            .label { font-size: 0.8rem; letter-spacing: 2px; }
            .target-date { margin-top: 30px; padding: 15px; }
            .progress-bar { margin-top: 30px; }
        }

        /* Small phones */
        @media (max-width: 480px) {
            .title { font-size: 1.4rem; letter-spacing: 1px; }
            .subtitle { font-size: 0.9rem; margin-bottom: 25px; }
            .countdown { gap: 10px; }
            .number { font-size: 2rem; }
            .time-box { 
                padding: 15px 18px; 
                min-width: 75px; 
                max-width: none;
                flex: 1 1 40%;
                border-radius: 15px;
            }
            .label { font-size: 0.7rem; letter-spacing: 1px; margin-top: 6px; }
            .container { padding: 15px; }
            .target-date { margin-top: 25px; padding: 12px; }
            .target-date .date-highlight { font-size: 1rem; }
            .progress-bar { margin-top: 25px; height: 4px; }
            .expired { font-size: 1.8rem; }
        }

        /* Very small phones */
        @media (max-width: 360px) {
            .title { font-size: 1.2rem; }
            .number { font-size: 1.6rem; }
            .time-box { 
                padding: 12px 14px; 
                min-width: 65px;
                flex: 1 1 45%;
            }
            .label { font-size: 0.65rem; }
        }
    .logoz img {
        width: 120px;
        height: 100px;
    }
    .logoz {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 40px;
    }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="logoz">
            <img src="imgs/beed.png" alt="">
            <img src="imgs/nisu.png" alt="" style="width: 160px; height: 130px; margin-right: -2px;">
            <img src="imgs/it.png" alt="">
        </div>
        <h1 class="title">5th University Commencement Exercises Countdown</h1>

        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div class="expired" id="expired">
            🎉 The countdown has ended! 🎉
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
    </div>

    <script>
        const targetDate = new Date('2026-06-10T16:00:00').getTime();
        const startTime = new Date().getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('expired').style.display = 'block';
                document.getElementById('progressFill').style.width = '100%';
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            const totalDuration = targetDate - startTime;
            const elapsed = now - startTime;
            const progress = Math.min((elapsed / totalDuration) * 100, 100);
            document.getElementById('progressFill').style.width = progress + '%';
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        createParticles();
    </script>

</body>
</html>
